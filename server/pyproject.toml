[project]
name = "thrust-server"
version = "0.1.0"
description = "WebSocket autopilot server for the Thrust lander game."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "pydantic-ai>=2.37.0",
    "pydantic-monty>=0.0.21",
    "uvicorn[standard]>=0.30",
]

[dependency-groups]
dev = [
    "basedpyright>=1.20",
    "httpx2>=2.12.0",
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["thrust_server"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "D",      # docstrings are optional
    "COM812", # conflicts with the formatter
    "ISC001", # conflicts with the formatter
    "CPY001", # no copyright headers
    "Q000",   # use flake8-quotes to control quote style
    "Q003",   # use flake8-quotes to control quote style
    "TC003"
]
flake8-quotes = { inline-quotes = "single", multiline-quotes = "double" }
mccabe = { max-complexity = 14 }

[tool.ruff.lint.isort]
combine-as-imports = true

[tool.ruff.format]
docstring-code-format = true
quote-style = "single"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "INP001", "PLR2004", "PLR0913", "ARG001"]

[tool.basedpyright]
pythonVersion = "3.14"
typeCheckingMode = "strict"
reportUnnecessaryTypeIgnoreComment = true
include = ["thrust_server", "tests"]
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
