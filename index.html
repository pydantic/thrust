<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Thrust</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #fff;
        overflow: hidden;
      }
      canvas {
        display: block;
        width: 100vw;
        height: 100vh;
      }
      .dialog {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: rgba(255, 255, 255, 0.6);
        font: 14px ui-monospace, SFMono-Regular, Menlo, monospace;
        color: #000;
      }
      .dialog[hidden] {
        display: none;
      }
      .dialog form {
        background: #fff;
        border: 2px solid #000;
        padding: 20px 24px;
        min-width: 280px;
        display: flex;
        flex-direction: column;
        gap: 14px;
      }
      .dialog h1 {
        margin: 0;
        font-size: 20px;
        font-weight: bold;
        letter-spacing: 0.1em;
      }
      .dialog p {
        margin: 0;
      }
      .dialog .result {
        font-weight: bold;
      }
      .dialog .result.landed {
        color: #0a0;
      }
      .dialog .result.crashed,
      .dialog .result.timeout,
      .dialog .result.aborted {
        color: #c00;
      }
      .dialog .error {
        color: #c00;
        max-width: 340px;
      }
      /* Live during a run, so it can be unticked before the flight ends. */
      .corner {
        position: fixed;
        right: 16px;
        bottom: 12px;
        font: 14px ui-monospace, SFMono-Regular, Menlo, monospace;
        color: #000;
      }
      .dialog .hint {
        color: #555;
      }
      .dialog label,
      .corner {
        display: flex;
        align-items: center;
        gap: 10px;
        cursor: pointer;
        user-select: none;
      }
      .dialog label[hidden] {
        display: none;
      }
      .dialog input[type="checkbox"],
      .corner input[type="checkbox"] {
        appearance: none;
        width: 16px;
        height: 16px;
        margin: 0;
        border: 2px solid #000;
        background: #fff;
        cursor: pointer;
        position: relative;
      }
      .dialog input[type="checkbox"]:checked::after,
      .corner input[type="checkbox"]:checked::after {
        content: "";
        position: absolute;
        inset: 2px;
        background: #000;
      }
      .dialog input[type="checkbox"]:focus-visible,
      .corner input[type="checkbox"]:focus-visible {
        outline: 2px dashed #000;
        outline-offset: 2px;
      }
      .dialog .seed input {
        font: inherit;
        border: 2px solid #000;
        background: #fff;
        color: #000;
        padding: 4px 6px;
        width: 12ch;
      }
      .dialog .seed input:focus-visible {
        outline: 2px dashed #000;
        outline-offset: 2px;
      }
      .dialog button {
        font: inherit;
        background: #fff;
        color: #000;
        border: 2px solid #000;
        padding: 8px 14px;
        cursor: pointer;
      }
      .dialog button:focus,
      .dialog button:focus-visible {
        outline: none;
      }
      .dialog button:hover {
        background: #000;
        color: #fff;
      }
      .dialog .buttons {
        display: flex;
        gap: 10px;
      }
      .dialog .buttons button {
        flex: 1;
      }
    </style>
  </head>
  <body>
    <canvas id="game"></canvas>
    <div id="dialog" class="dialog" hidden>
      <form id="dialog-form">
        <h1>THRUST</h1>
        <p id="dialog-result" class="result" hidden></p>
        <p id="dialog-error" class="error" hidden></p>
        <p class="hint">&uarr; thrust &nbsp; &larr; &rarr; rotate &nbsp; R restart &nbsp; space start</p>
        <label><input type="checkbox" id="autopilot" /> Enable auto-pilot</label>
        <label class="seed" id="seed-label">Seed <input type="text" id="seed" inputmode="numeric" autocomplete="off" /></label>
        <div class="buttons">
          <button type="submit" id="start-new">New game</button>
          <button type="submit" id="start-replay">Replay</button>
        </div>
      </form>
    </div>
    <label class="corner"><input type="checkbox" id="autoreplay" /> Restart automatically</label>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
